services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bot_crm_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo_local_only
      MYSQL_ROOT_PASSWORD: demo_root_local_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - demo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u demo -pdemo_local_only --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  demo_mysql:
